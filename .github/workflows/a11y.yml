# Accessibility — Pa11y WCAG 2.1 AA (WCAG2AA) on public web pages
# Runs on PR + main. Does not block deploy by default (continue-on-error optional).

name: Accessibility

on:
  pull_request:
    branches: [main, master]
    paths:
      - "donationchain/**"
      - ".pa11yci.json"
      - ".github/workflows/a11y.yml"
  push:
    branches: [main, master]
    paths:
      - "donationchain/**"
      - ".pa11yci.json"
      - ".github/workflows/a11y.yml"
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pa11y:
    name: Pa11y WCAG2AA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci@3 pa11y@8 --no-fund --no-audit

      - name: Start static server
        working-directory: donationchain
        run: |
          npx --yes serve -l 4173 . &
          echo $! > /tmp/serve.pid
          # Wait until server responds
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4173/index.html" >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run Pa11y CI
        id: pa11y
        run: |
          mkdir -p artifacts
          set +e
          pa11y-ci --config .pa11yci.json --sitemap-find none 2>&1 | tee pa11y-report.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Upload-friendly summary
          if [ "$code" -ne 0 ]; then
            echo "::warning::Pa11y found accessibility issues (exit $code). See pa11y-report.txt"
          fi
          exit 0

      - name: Upload Pa11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-report
          path: |
            pa11y-report.txt
            artifacts/a11y-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Accessibility (Pa11y WCAG2AA)"
            echo ""
            echo "Pages: home, apply (seeker), donor register, donor dashboard, explorer"
            echo ""
            echo '```'
            tail -n 80 pa11y-report.txt 2>/dev/null || echo "No report file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/serve.pid ]; then kill $(cat /tmp/serve.pid) 2>/dev/null || true; fi
