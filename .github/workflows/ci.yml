# Runs on every PR and every push to main

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web JS check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax
        run: |
          for f in donationchain/js/*.js; do
            node --check "$f"
            echo "OK $f"
          done

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: donationchain_backend/package-lock.json
      - name: Cache npm fallback
        if: hashFiles('donationchain_backend/package-lock.json') == ''
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-be-${{ runner.os }}-${{ hashFiles('donationchain_backend/package.json') }}
          restore-keys: npm-be-${{ runner.os }}-
      - name: Syntax
        run: |
          find donationchain_backend/src -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
            echo "OK $f"
          done

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          test -f donationchain_contracts/contracts/DonationRegistry.sol
          test -f donationchain_contracts/abi/DonationRegistry.json
          echo OK
