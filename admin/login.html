<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — DonationChain</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#1A56DB'}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex w-14 h-14 bg-primary rounded-2xl items-center justify-center text-white text-xl font-bold mb-4">D</div>
      <h1 class="text-2xl font-extrabold text-white">Admin access</h1>
      <p class="text-slate-400 text-sm mt-1">DonationChain operations panel</p>
    </div>

    <form id="login-form" class="bg-white rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5" autocomplete="off">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Username</label>
        <input id="username" type="text" value="admin" autocomplete="username"
          class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary focus:outline-none mb-4" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Password</label>
        <div class="relative">
          <input id="password" type="password" required minlength="4"
            class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary focus:outline-none pr-11"
            placeholder="Enter admin password" autofocus />
          <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <p id="error" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-3 py-2"></p>
      <p id="lock-msg" class="hidden text-sm text-amber-700 bg-amber-50 rounded-xl px-3 py-2"></p>

      <button type="submit" id="submit-btn" class="w-full bg-primary text-white py-3 rounded-xl font-semibold text-sm hover:bg-blue-700 transition">
        <i class="fas fa-lock mr-2"></i> Sign in
      </button>

      <p class="text-[11px] text-slate-400 text-center leading-relaxed">
        Demo default: <code class="bg-slate-100 px-1 rounded">Admin@DC2026</code><br />
        Server JWT when backend is running (localhost:4000) · else local session · 5 fails → 15 min lock
      </p>
    </form>

    <p class="text-center mt-6">
      <a href="../index.html" class="text-slate-400 text-sm hover:text-white transition">← Back to site</a>
    </p>
  </div>

  <script src="../js/admin-auth.js"></script>
  <script>
    (function () {
      if (AdminAuth.isAuthenticated()) {
        location.replace("index.html");
        return;
      }

      const form = document.getElementById("login-form");
      const err = document.getElementById("error");
      const lockMsg = document.getElementById("lock-msg");
      const pw = document.getElementById("password");

      function showLock() {
        if (!AdminAuth.isLocked()) {
          lockMsg.classList.add("hidden");
          return;
        }
        const m = Math.ceil(AdminAuth.lockRemainingMs() / 60000);
        lockMsg.textContent = "Locked. Try again in about " + m + " minute(s).";
        lockMsg.classList.remove("hidden");
      }
      showLock();
      setInterval(showLock, 5000);

      document.getElementById("toggle-pw").addEventListener("click", function () {
        const t = pw.type === "password" ? "text" : "password";
        pw.type = t;
        this.innerHTML = t === "password" ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        err.classList.add("hidden");
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Checking…';

        const user = (document.getElementById('username') || {}).value || 'admin';
        const result = await AdminAuth.login(pw.value, user);
        if (!result.ok) {
          err.textContent = result.error;
          err.classList.remove("hidden");
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-lock mr-2"></i> Sign in';
          showLock();
          return;
        }

        const params = new URLSearchParams(location.search);
        const next = params.get("next");
        // Only allow relative admin paths
        let dest = "index.html";
        if (next && next.indexOf("..") === -1 && next.indexOf("admin") !== -1) {
          dest = next;
        }
        location.replace(dest.startsWith("/") ? dest : dest);
      });
    })();
  </script>
</body>
</html>
