<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Impact — DonationChain</title>
  <meta name="robots" content="noindex" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#1A56DB',accent:'#06B6D4',success:'#059669',warning:'#D97706',danger:'#DC2626'}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 font-bold text-slate-900">
        <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white text-sm">D</div>
        DonationChain
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="../index.html#cases" class="text-slate-600 hover:text-primary">Browse cases</a>
        <span id="user-label" class="font-medium text-slate-800">Donor</span>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Your impact</h1>
        <p class="text-slate-500 text-sm mt-1">Transparent history · Digital receipts · Vendor proofs</p>
      </div>
      <a href="../index.html#cases" class="inline-flex items-center justify-center bg-primary text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-700">Donate again</a>
    </div>

    <div class="grid sm:grid-cols-3 gap-4 mb-10">
      <div class="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-2xl p-5 border border-blue-100">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Lifetime donated</p>
        <p class="text-3xl font-extrabold text-primary mt-1" id="total-donated">PKR 0</p>
      </div>
      <div class="bg-white rounded-2xl p-5 border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Donations</p>
        <p class="text-3xl font-extrabold mt-1" id="donation-count">0</p>
      </div>
      <div class="bg-white rounded-2xl p-5 border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Est. lives impacted</p>
        <p class="text-3xl font-extrabold text-success mt-1" id="lives-count">0</p>
      </div>
    </div>

    <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
      <h2 class="text-lg font-bold">Donation history</h2>
      <div class="flex gap-3">
        <button onclick="exportCSV()" class="text-sm text-slate-600 font-medium hover:text-primary"><i class="fas fa-download mr-1"></i>Export CSV</button>
        <button onclick="loadDonations()" class="text-sm text-primary font-medium hover:underline">Refresh</button>
      </div>
    </div>
    <div id="donations-list" class="space-y-3"></div>
  </main>

  <script>
    function formatPKR(n) {
      return 'PKR ' + Number(n).toLocaleString('en-PK');
    }

    function loadDonations() {
      const list = JSON.parse(localStorage.getItem('dc_donations') || '[]');
      const user = JSON.parse(localStorage.getItem('dc_user') || 'null');
      if (user) document.getElementById('user-label').textContent = user.name || user.phone || 'Donor';

      const total = list.reduce((s, d) => s + Number(d.amount || 0), 0);
      document.getElementById('total-donated').textContent = formatPKR(total);
      document.getElementById('donation-count').textContent = list.length;
      document.getElementById('lives-count').textContent = Math.max(list.length * 2, list.length);

      const el = document.getElementById('donations-list');
      if (!list.length) {
        el.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-10 text-center">
            <i class="fas fa-hand-holding-heart text-4xl text-slate-300 mb-3"></i>
            <p class="font-medium text-slate-600">No donations yet</p>
            <p class="text-sm text-slate-400 mt-1 mb-4">Your receipts and proofs will appear here.</p>
            <a href="../index.html#cases" class="text-primary text-sm font-semibold">Browse verified cases →</a>
          </div>`;
        return;
      }

      el.innerHTML = list.map(d => `
        <article class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">
          <div class="w-11 h-11 rounded-xl bg-blue-50 text-primary flex items-center justify-center shrink-0">
            <i class="fas fa-receipt"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-slate-900 truncate">${d.case || 'Donation'}</p>
            <p class="text-xs text-slate-500 mt-0.5">
              ${d.id || ''} · ${(d.method || '').toUpperCase()} · ${d.date ? new Date(d.date).toLocaleString() : ''}
              ${d.anonymous ? ' · Anonymous' : ''}
            </p>
            <p class="text-xs text-slate-400 mt-1">${d.proof || d.vendor || ''}</p>
          </div>
          <div class="text-left sm:text-right">
            <p class="font-bold text-success">${formatPKR(d.amount)}</p>
            <p class="text-[11px] text-slate-400 uppercase font-semibold mt-0.5">${d.status || 'completed'}</p>
          </div>
        </article>
      `).join('');
    }

    
    function exportCSV() {
      const list = JSON.parse(localStorage.getItem('dc_donations') || '[]');
      if (!list.length) { alert('No donations to export'); return; }
      const headers = ['id','amount','method','case','vendor','city','date','status','blockHash'];
      const rows = list.map(d => headers.map(h => {
        const v = d[h] == null ? '' : String(d[h]);
        return '"' + v.replace(/"/g, '""') + '"';
      }).join(','));
      const csv = headers.join(',') + '\n' + rows.join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'donationchain-history.csv';
      a.click();
    }
    document.addEventListener('DOMContentLoaded', loadDonations);
  </script>
</body>
</html>
