<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger Explorer — DonationChain</title>
  <meta name="robots" content="noindex" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#1A56DB',success:'#059669'}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-bold">
        <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white text-sm">D</div>
        DonationChain
      </a>
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Explorer</span>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-10 space-y-10">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Verification explorer</h1>
      <p class="text-sm text-slate-500 mt-1">Hash-chain tip · Merkle batches · inclusion proofs (local browser ledger)</p>
    </div>

    <!-- Stats -->
    <div class="grid sm:grid-cols-3 gap-4">
      <div class="bg-white border border-slate-200 rounded-2xl p-5">
        <p class="text-xs font-semibold text-slate-500 uppercase">Chain blocks</p>
        <p class="text-3xl font-extrabold mt-1" id="stat-blocks">—</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-5">
        <p class="text-xs font-semibold text-slate-500 uppercase">Merkle batches</p>
        <p class="text-3xl font-extrabold mt-1" id="stat-batches">—</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-5">
        <p class="text-xs font-semibold text-slate-500 uppercase">Chain valid</p>
        <p class="text-3xl font-extrabold mt-1" id="stat-valid">—</p>
      </div>
    </div>

    <!-- Tip -->
    <section class="bg-white border border-slate-200 rounded-2xl p-6">
      <h2 class="font-bold mb-3 flex items-center gap-2"><i class="fas fa-link text-primary"></i> Ledger tip</h2>
      <div id="tip-box" class="font-mono text-xs break-all text-slate-600 bg-slate-50 rounded-xl p-4">Loading…</div>
    </section>

    <!-- Look up -->
    <section class="bg-white border border-slate-200 rounded-2xl p-6">
      <h2 class="font-bold mb-3">Look up receipt</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="lookup-id" type="text" placeholder="DC-…" class="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-mono focus:ring-2 focus:ring-primary focus:outline-none" />
        <button onclick="runLookup()" class="bg-primary text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-700">Verify all layers</button>
      </div>
      <div id="lookup-out" class="mt-4 text-sm space-y-3"></div>
    </section>

    <!-- Batches -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold">Merkle batches</h2>
        <button onclick="rebuildBatch()" class="text-sm text-primary font-semibold hover:underline">Rebuild from donations</button>
      </div>
      <div id="batches-list" class="space-y-2"></div>
    </section>

    <!-- Recent chain -->
    <section>
      <h2 class="font-bold mb-3">Recent chain blocks</h2>
      <div id="chain-list" class="space-y-2"></div>
    </section>
  </main>

  <script src="js/ledger.js"></script>
  <script src="js/merkle.js"></script>
  <script>
    function short(h) {
      if (!h || h.length < 18) return h || "—";
      return h.slice(0, 10) + "…" + h.slice(-8);
    }

    async function refresh() {
      if (!window.Ledger) return;
      const chain = await Ledger.getChain();
      const check = await Ledger.verifyChain(chain);
      const tip = chain[chain.length - 1];
      document.getElementById("stat-blocks").textContent = chain.length;
      document.getElementById("stat-valid").textContent = check.valid ? "Yes" : "No";
      document.getElementById("stat-valid").className =
        "text-3xl font-extrabold mt-1 " + (check.valid ? "text-success" : "text-red-600");
      document.getElementById("tip-box").innerHTML =
        `<div class="space-y-1"><div><span class="text-slate-400">#${tip.index}</span> ${short(tip.hash)}</div>
         <div class="text-slate-400">prev ${short(tip.prevHash)} · ${tip.timestamp}</div>
         <div class="text-slate-500">${tip.data?.type || ""} ${tip.data?.receiptId || tip.data?.message || ""}</div></div>`;

      const list = document.getElementById("chain-list");
      const recent = chain.slice().reverse().slice(0, 12);
      list.innerHTML = recent.map(b => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center gap-2 text-sm">
          <span class="font-mono text-xs text-slate-400 w-10">#${b.index}</span>
          <span class="font-mono text-xs flex-1 break-all">${short(b.hash)}</span>
          <span class="text-slate-500 truncate max-w-xs">${b.data?.receiptId || b.data?.type || ""}</span>
          <span class="text-[11px] text-slate-400">${b.data?.amount != null ? "PKR " + Number(b.data.amount).toLocaleString() : ""}</span>
        </div>`).join("") || '<p class="text-slate-400 text-sm">Empty chain</p>';

      if (window.Merkle) {
        const batches = Merkle.loadBatches();
        document.getElementById("stat-batches").textContent = batches.length;
        document.getElementById("batches-list").innerHTML = batches.length
          ? batches.map(b => `
            <div class="bg-white border border-slate-200 rounded-xl p-4">
              <div class="flex flex-wrap justify-between gap-2 mb-1">
                <span class="font-semibold text-sm">${b.id}</span>
                <span class="text-xs text-slate-400">${b.leafCount} leaves · ${b.label}</span>
              </div>
              <p class="font-mono text-[11px] break-all text-slate-600">${b.root}</p>
            </div>`).join("")
          : '<p class="text-slate-400 text-sm">No batches yet. Donate or click Rebuild.</p>';
      }
    }

    async function rebuildBatch() {
      if (!window.Merkle) return;
      const batch = await Merkle.rebuildFromDonations();
      if (!batch) {
        alert("No donations in localStorage. Donate from the home page first.");
        return;
      }
      await refresh();
    }

    async function runLookup() {
      const id = (document.getElementById("lookup-id").value || "").trim();
      const out = document.getElementById("lookup-out");
      if (!id) { out.innerHTML = '<p class="text-amber-600">Enter a receipt ID</p>'; return; }
      out.innerHTML = '<p class="text-slate-500"><i class="fas fa-spinner fa-spin"></i> Checking…</p>';

      let html = "";
      // Ledger
      if (window.Ledger) {
        const lr = await Ledger.verifyReceipt(id);
        if (lr.found) {
          html += `<div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4">
            <p class="font-semibold text-success"><i class="fas fa-link mr-1"></i> On hash-chain</p>
            <p class="text-xs font-mono mt-1 break-all">Block #${lr.block.index} · ${lr.block.hash}</p>
          </div>`;
        } else {
          html += `<div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-600">Not on hash-chain (${lr.error || "missing"})</div>`;
        }
      }
      // Merkle
      if (window.Merkle) {
        const mr = await Merkle.verifyReceiptMerkle(id);
        if (mr.found && mr.valid) {
          html += `<div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4">
            <p class="font-semibold text-indigo-700"><i class="fas fa-sitemap mr-1"></i> Merkle inclusion valid</p>
            <p class="text-xs mt-1">Batch ${mr.batchId} · ${mr.proof.length} siblings</p>
            <p class="text-[11px] font-mono break-all mt-1">Root ${mr.root}</p>
          </div>`;
        } else {
          html += `<div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-600">Merkle: ${mr.error || "not in batch"}</div>`;
        }
      }
      out.innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", refresh);
  </script>
</body>
</html>
